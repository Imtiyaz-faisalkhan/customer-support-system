spring.application.name=backend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/customer_support
spring.datasource.username=customer_support
spring.datasource.password=customer_support

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Single hardcoded admin account for this MVP (no multi-user/roles).
# Change these to rotate credentials -- do not hardcode them in Java source.
app.admin.username=admin
app.admin.password=changeme123

# Local dev: seed sample tickets into an empty DB on startup (see DemoTicketSeeder). Set to false to disable
# (scripts/run-backend-resend.sh does, since replies there are real emails).
app.demo-data.enabled=${DEMO_DATA_ENABLED:true}

# Session cookie: SameSite=Lax keeps browsers from sending it on cross-site POSTs, which is the CSRF defence
# relied on in SecurityConfig. HttpOnly keeps it away from scripts.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Addresses the UI may be opened on (comma-separated): local dev server, local preview server + the public ngrok
# address from scripts/start-tunnel.sh (PUBLIC_APP_URL; scripts/run-backend-resend.sh sets it from NGROK_URL).
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173,${PUBLIC_APP_URL:}

# --- Email (see docs/EMAIL_SETUP.md) ---------------------------------------------------------------
# Defaults are for local development: replies go to Mailpit (docker compose, inbox at http://localhost:8025)
# and nothing reaches a real customer. For Resend, scripts/run-backend-resend.sh sets these via env vars.
app.email.support-address=${SUPPORT_EMAIL_ADDRESS:support@example.com}
app.email.support-name=${SUPPORT_EMAIL_NAME:Customer Support}
# smtp = send via spring.mail.* below; log = only log replies (no mail server needed)
app.email.outbound=${EMAIL_OUTBOUND:smtp}
# true = refuse to reply to reserved test domains (example.com, .test, ...): with real email those only bounce.
# Off locally so the demo tickets can be answered into Mailpit.
app.email.reject-reserved-recipients=${REJECT_RESERVED_RECIPIENTS:false}
# Resend receiving (POST /api/webhooks/resend): signing secret "whsec_..." from the Resend webhook page, and an
# API key "re_..." to fetch the email. Without the secret, every Resend webhook is rejected.
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.resend.webhook-secret=${RESEND_WEBHOOK_SECRET:}
app.email.resend.api-base-url=https://api.resend.com

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


# --- AI ticket categorization (Spring AI + Gemini; see TicketCategorizationListener) ------------------------
# google-genai = categorize new tickets with Gemini; none = AI off (no key needed, tickets stay Uncategorized).
# The key (Google AI Studio) comes only from the environment (scripts/run-backend-resend.sh asks for it).
spring.ai.model.chat=${AI_CHAT_PROVIDER:none}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=gemini-3.8-flash
# The answer is one small JSON object. No "thinking": it isn't needed to pick a category, and thinking tokens
# would count against the output limit.
spring.ai.google.genai.chat.response-mime-type=application/json
spring.ai.google.genai.chat.thinking-budget=0
spring.ai.google.genai.chat.max-output-tokens=256
