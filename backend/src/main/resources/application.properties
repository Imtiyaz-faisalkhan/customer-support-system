spring.application.name=backend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/customer_support
spring.datasource.username=customer_support
spring.datasource.password=customer_support

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Single hardcoded admin account for this MVP (no multi-user/roles).
# Change these to rotate credentials -- do not hardcode them in Java source.
app.admin.username=admin
app.admin.password=changeme123

# Local dev: seed sample tickets into an empty DB on startup (see DemoTicketSeeder). Set to false to disable.
app.demo-data.enabled=true

# Addresses the UI may be opened on (comma-separated): local dev server + the public ngrok address from
# scripts/start-tunnel.sh. Override with PUBLIC_APP_URL if the tunnel address changes.
app.cors.allowed-origins=http://localhost:5173,${PUBLIC_APP_URL:https://your-name.ngrok-free.dev}

# --- Email (see docs/EMAIL_SETUP.md) ---------------------------------------------------------------
# Defaults are for local development: replies go to Mailpit (docker compose, inbox at http://localhost:8025)
# and nothing reaches a real customer. For SendGrid, override these with environment variables.
app.email.support-address=${SUPPORT_EMAIL_ADDRESS:support@example.com}
app.email.support-name=${SUPPORT_EMAIL_NAME:Customer Support}
# smtp = send via spring.mail.* below; log = only log replies (no mail server needed)
app.email.outbound=${EMAIL_OUTBOUND:smtp}
# HTTP Basic credentials SendGrid must send to POST /api/webhooks/sendgrid/inbound.
# The default is for local testing only; set INBOUND_WEBHOOK_PASSWORD to a long random value for real use.
app.email.webhook.username=${INBOUND_WEBHOOK_USERNAME:sendgrid}
app.email.webhook.password=${INBOUND_WEBHOOK_PASSWORD:local-dev-webhook-secret}

# Inbound: "webhook" = only POST /api/webhooks/sendgrid/inbound receives email (local simulation script);
# "imap" = also poll a real mailbox (e.g. IONOS) and import new emails. See docs/EMAIL_SETUP.md.
app.email.inbound=${EMAIL_INBOUND:webhook}
app.email.imap.host=${IMAP_HOST:imap.ionos.com}
app.email.imap.port=${IMAP_PORT:993}
app.email.imap.ssl=${IMAP_SSL:true}
app.email.imap.username=${IMAP_USERNAME:${app.email.support-address}}
app.email.imap.password=${IMAP_PASSWORD:}
app.email.imap.folder=INBOX
# Imported emails are moved here (created automatically), so the inbox only holds not-yet-imported mail.
app.email.imap.processed-folder=Imported
app.email.imap.batch-size=50
app.email.imap.poll-interval=${IMAP_POLL_INTERVAL:30s}

# Resend receiving (POST /api/webhooks/resend): signing secret "whsec_..." from the Resend webhook page, and an
# API key "re_..." to fetch the email. Without the secret, every Resend webhook is rejected.
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.resend.webhook-secret=${RESEND_WEBHOOK_SECRET:}
app.email.resend.api-base-url=https://api.resend.com

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# SendGrid posts emails up to 30MB including attachments (which we ignore).
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
