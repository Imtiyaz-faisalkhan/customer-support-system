# Render deployment (deploy branch; Render sets SPRING_PROFILES_ACTIVE=prod, see render.yaml and
# docs/DEPLOY_RENDER.md). Overrides application.properties; every secret comes from the service's environment.

# Render tells the app which port to listen on.
server.port=${PORT}

# Render's Postgres; render.yaml passes its parts separately (its connection string isn't a JDBC URL).
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
# Small pool: the free instance has 512 MB and the free database few connections.
spring.datasource.hikari.maximum-pool-size=5

# Render terminates HTTPS in front of the app: trust its X-Forwarded-* headers and only send the cookie over HTTPS.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

# The app's own public address (https://<service>.onrender.com); see WebConfig / CorsIntegrationTest.
app.cors.allowed-origins=${PUBLIC_APP_URL}

app.demo-data.enabled=false
# Render's free tier blocks outbound SMTP ports, so replies go through Resend's HTTP API.
app.email.outbound=resend-api
app.email.reject-reserved-recipients=true

# No fallback: without APP_ADMIN_PASSWORD the app refuses to start instead of using the local default password.
app.admin.password=${APP_ADMIN_PASSWORD}
