services:
  postgres:
    image: postgres:16
    container_name: customer-support-postgres
    environment:
      POSTGRES_DB: customer_support
      POSTGRES_USER: customer_support
      POSTGRES_PASSWORD: customer_support
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Local fake mail server: the backend's outbound replies land here instead of real inboxes.
  # SMTP on 1025 (backend default), web inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: customer-support-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
